name: Trading Stop-Check

on:
  schedule:
    # E-Mail-Ziel: 02:00 & 13:00 Europe/Berlin (UTC+2 Sommer)
    # Früh nach EOD → vor EU-Open 09:00 (Puffer bei GitHub-Verzug)
    # + Mittag vor US-Open ~15:30
    # Winter (UTC+1): auf "0 1" und "0 12" umstellen
    - cron: "0 0 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Stop check & email
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python stop_check.py
